<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warp #0</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-nav">
                <div class="sidebar-header-row">
                    <span class="sidebar-title">WarpMind 0</span>
                    <div class="sidebar-icons">
                        <button class="icon-btn" title="Search">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </button>
                        <button class="icon-btn" title="Toggle sidebar">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="9" y1="3" x2="9" y2="21"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <button class="sidebar-btn">New chat</button>
                <button class="sidebar-btn">Images </button>
                <button class="sidebar-btn">Library</button>
                <button class="sidebar-btn">Scheduled</button>
                <button class="sidebar-btn">Plugins</button>
                <button class="sidebar-btn">Projects</button>
                <button class="sidebar-btn">Codex</button>
                <button class="sidebar-btn">More</button>
            </div>

            <div class="sidebar-recents">
                <span class="recents-header">Recents</span>
                <div class="recent-chat-item">Fake Recent Chat Title...</div>
            </div>
        </aside>

        
        <main class="main-chat">
            <h1 id="greeting">Hello A.I User.</h1>
            
        
            <div class="chat-history"></div>
            
            <div class="input-container">
                <button class="left-icon-btn" title="Add attachment">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>

                <textarea placeholder="Ask A.I"></textarea>

                <button class="microphone" title="Vocal message">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>

                <button class="send-btn" title="Send message">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </main>
    </div>
    
    <script src="https://warp.cs.au.dk/libs/warpmind.js"></script>
    <script src="script.js"></script>
</body>
</html>
